name: install-db

# Frische Installation der App auf MariaDB und MySQL, Beschreibung im README.

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP-Version des Servers.'
        type: string
        default: '8.4'
      server-branch:
        description: 'Zweig von nextcloud/server. Leer = stable<min-version> aus info.xml.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    name: Installation (${{ matrix.db }})
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # mariadb:11 bringt kein mysqladmin mehr mit, dort healthcheck.sh.
          - db: mariadb
            image: mariadb:11
            health: healthcheck.sh --connect --innodb_initialized
          - db: mysql
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -u root -pci-root-pass

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pass
          MYSQL_DATABASE: nextcloud
          MYSQL_USER: nextcloud
          MYSQL_PASSWORD: ci-db-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      # Erst an einen Nebenpfad: der Serverzweig wird aus info.xml abgeleitet.
      - name: App auschecken
        uses: actions/checkout@v4
        with:
          path: app-src

      - name: App-ID und NC-Zweig aus info.xml ableiten
        id: derive
        working-directory: app-src
        env:
          SERVER_BRANCH: ${{ inputs.server-branch }}
        run: |
          app=$(grep -oE '<id>[a-z0-9_]+</id>' appinfo/info.xml | head -n 1 | sed -E 's/<\/?id>//g')
          if [ -z "$app" ]; then
            echo "::error::Konnte die App-ID nicht aus info.xml lesen"; exit 1
          fi
          branch="$SERVER_BRANCH"
          if [ -z "$branch" ]; then
            min=$(grep -oE '<nextcloud[^>]*/>' appinfo/info.xml | grep -oE 'min-version="[0-9]+"' | grep -oE '[0-9]+' || true)
            if [ -z "$min" ]; then
              echo "::error::Konnte min-version nicht aus info.xml lesen"; exit 1
            fi
            # Die Untergrenze: dort landet ein Bruch zuerst.
            branch="stable$min"
          fi
          if ! [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Ungueltiger Serverzweig: $branch"; exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "App: $app, Serverzweig: $branch"

      - name: Nextcloud-Server auschecken
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          ref: ${{ steps.derive.outputs.branch }}
          submodules: true
          fetch-depth: 1
          path: server

      - name: App nach apps/ verschieben
        env:
          APP: ${{ steps.derive.outputs.app }}
        run: mv app-src "server/apps/$APP"

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: bz2, ctype, curl, dom, fileinfo, gd, gmp, iconv, intl, json, mbstring, openssl, pcntl, posix, session, simplexml, mysql, pdo_mysql, xml, xmlreader, xmlwriter, zip, zlib
          coverage: none
          tools: composer:v2

      # --no-dev wie im Release-Tarball.
      - name: Abhaengigkeiten der App installieren
        working-directory: server/apps/${{ steps.derive.outputs.app }}
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --no-interaction --no-progress --prefer-dist
          fi

      - name: Nextcloud installieren (${{ matrix.db }})
        working-directory: server
        run: |
          mkdir -p data
          php occ maintenance:install \
            --database mysql \
            --database-host 127.0.0.1 \
            --database-name nextcloud \
            --database-user nextcloud \
            --database-pass ci-db-pass \
            --admin-user admin \
            --admin-pass admin-pass-for-ci \
            --data-dir "$PWD/data"

      # installed_version steht erst, wenn alle Migrationen durchgelaufen sind.
      - name: App aktivieren (faehrt die Migrationen)
        working-directory: server
        env:
          APP: ${{ steps.derive.outputs.app }}
        run: |
          php occ app:enable "$APP"
          php occ config:app:get "$APP" installed_version

      - name: Serverprotokoll ausgeben
        if: failure()
        run: tail -n 200 server/data/nextcloud.log || true
