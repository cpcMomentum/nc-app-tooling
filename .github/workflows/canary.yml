name: canary (next NC)

# Fruehwarnung gegen die Entwicklungsversion von Nextcloud (worktime#21).
# Laeuft die Unit-Suite gegen nextcloud/ocp:dev-master (= naechstes NC-Major)
# und beantwortet die Frage "bricht das kommende NC etwas bei uns, bevor es
# released ist". BEWUSST kein Required-Status-Check: wird er rot, ist das eine
# sichtbare Warnung — blockiert aber niemals einen Merge (das Gate sind allein
# die phpunit-Matrix + node).
#
# dev-master verlangt PHP >= 8.3 (NC 35 droppt 8.2), daher 8.4 + Anheben des
# composer-Platform-Pins (der sonst auf 8.2 fixiert und dev-master ausschliesst).
#
# Geteilte Fassung fuer die App-Flotte (contractmanager#339). Die Apps rufen sie
# ueber `uses:` auf; Ausloeser und Concurrency bleiben beim Aufrufer, weil nur
# der weiss, auf welchen Branches er laufen soll.

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP-Version fuer den Lauf. dev-master verlangt >= 8.3.'
        type: string
        default: '8.4'
      checkout-ref:
        description: 'Optionaler Ref fuer den Checkout (leer = Standard).'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  canary:
    name: ocp dev-master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Setup PHP ${{ inputs.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2

      - name: Platform-Pin anheben (dev-master droppt PHP 8.2)
        run: composer config platform.php ${{ inputs.php-version }}

      - name: nextcloud/ocp auf dev-master setzen
        run: composer require --dev --no-update "nextcloud/ocp:dev-master"

      - name: Abhaengigkeiten installieren
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Unit-Tests gegen die NC-Entwicklungsversion
        run: composer test
