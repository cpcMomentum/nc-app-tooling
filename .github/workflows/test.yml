name: test

# Vier Werkzeuge pruefen fuenf Apps — und bis zum 15.08.2026 pruefte niemand die
# vier Werkzeuge. Vier der Werkzeugfehler, die in den Apps aufgefallen sind,
# waeren hier aufgefallen: der Fehlalarm des Bundle-Checks (#1), die
# zusammengesetzten PHP-Meldungen, die dynamisch uebersetzten Schluessel und
# das auf 1.0.0 stehengebliebene version-Feld.
#
# Die Tests bauen sich ihre eigene Wegwerf-App und brauchen weder Nextcloud
# noch eine der fuenf Apps. Sie laufen in Sekunden.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 ist die Untergrenze aus engines, 24 das, womit lokal gearbeitet
        # wird. Bricht eines von beiden, laeuft eine der Apps ins Leere.
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Die Werkzeuge haben keine Laufzeit-Abhaengigkeiten, es gibt nichts zu
      # installieren. Die Tests rufen allerdings `npm ci` in ihrer Wegwerf-App
      # auf — dafuer reicht das npm, das mit Node kommt.
      - name: Tests
        run: npm test
