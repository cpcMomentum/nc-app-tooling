name: verbreitung

# Misst quartalsweise die Release-Downloads der Flotte und schreibt sie ins Mess-Issue, Beschreibung im README.

on:
  schedule:
    - cron: '23 6 1 1,4,7,10 *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  messen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Messen und ins Issue schreiben
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/verbreitung.mjs --post
